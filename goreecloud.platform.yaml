schema_version: "0.4"

component:
  type: server
  id: goreecloud-feeds-server
  product_name: GoreeCloud Feeds Server
  repository: GoreeCloud/feeds-server

lifecycle: planned
version: "0.1.0-planned"

supported_platforms:
  - server

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: [README.md, SPECIFICATIONS.md]
    notes: Manager registration, lifecycle visibility, health/readiness publication, and accepted operational integration are not implemented.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence: [PRIVACY POLICY.md, SPECIFICATIONS.md]
    notes: Planned privacy requirements exist, but no runtime Privacy Shield integration or acceptance exists.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: [SECURITY.md, SPECIFICATIONS.md]
    notes: Planned security requirements exist, but no Wardveil Security runtime integration or acceptance exists.
  everkeep:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md, USER-MANUAL.md]
    notes: Backup and restore are required by the roadmap, but no Everkeep implementation or recovery acceptance exists.
  glaze_ui:
    result: applicable-blocked
    version: "1.6.0"
    evidence: [README.md, BRANDING.md]
    notes: Current Official Stable Glaze UI V1.6.0 is the target for supported Feeds administration/client surfaces, but this server repository has no accepted user-interface integration.
  mesh:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md]
    notes: Mesh registration, discovery, event contracts, capabilities, and runtime acceptance are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md, SECURITY.md]
    notes: GoreeCloud Identity is the planned identity/authentication authority, but no accepted integration exists.
  policy:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md]
    notes: GoreeCloud Policy integration, provenance, freshness, exception, and enforcement coordination are not established.
  observability:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md]
    notes: No accepted GoreeCloud Observability integration exists.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the complete persistent server backup scope before deployment qualification.
      - Integrate and validate approved Everkeep backup behavior before Release Candidate acceptance.
  restore:
    required: true
    requirements:
      - Validate isolated clean-target restore of account, feed, article, synchronization, configuration, and required index state.
  export:
    required: true
    requirements:
      - Provide portable exports for user-owned data without exposing reusable credentials.
  portability:
    required: true
    requirements:
      - Keep durable user data and protocol-visible state in versioned, documented, migratable forms.

external_dependencies: []

compatibility:
  platform_contract: "0.4"
  requires:
    - goreecloud-platform-contract==0.4
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence: [README.md, SPECIFICATIONS.md, FEATURES.md, SECURITY.md, PRIVACY POLICY.md]
  blockers:
    - No server runtime, data store, API, feed retrieval, parsing, search, synchronization, administration, or packaging implementation exists.
    - GoreeCloud Identity integration and acceptance are not established.
    - Wardveil Security integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established.
    - Everkeep backup/restore/recovery acceptance is not established.
    - GoreeCloud Manager integration and acceptance are not established.
    - GoreeCloud Mesh integration and acceptance are not established.
    - GoreeCloud Policy integration and acceptance are not established.
    - GoreeCloud Observability integration and acceptance are not established.
    - Release, deployment, rollback, target-environment validation, and Stable qualification do not exist.
