name: Server CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: feeds_ci
          POSTGRES_PASSWORD: feeds_ci_only_password
          POSTGRES_DB: feeds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feeds_ci -d feeds_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FEEDS_TEST_DATABASE_URL: postgres://feeds_ci:feeds_ci_only_password@127.0.0.1:5432/feeds_ci?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf "%s\n" "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
